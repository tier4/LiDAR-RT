data_type: "T4"

# Skip frames whose range image is missing whole azimuth bands (rosbag packet
# drops). The threshold is the fraction of columns where every downward beam
# has zero return; >1% reliably distinguishes packet-drop frames from healthy
# ones for the Hesai OT128 used here.
skip_dropped_frames: True
dropped_frame_threshold: 0.01

# Single TOP LiDAR configuration (Waymo-style baseline).
# Multi-LiDAR setup is preserved in git history (revert this file to restore).
lidar_sensors:
  - name: hesai_top
    topic: "/sensing/lidar/top/pandar_packets"
    sensor_type: "OT128"
    frame_id: "hesai_top"
    range_image_height: 128
    range_image_width: 1800
    inc_bottom: -25.0
    inc_top: 15.0
    max_depth: 200.0

max_depth: 200.0
