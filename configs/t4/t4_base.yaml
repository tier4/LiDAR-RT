data_type: "T4"

# LiDAR channel to use
lidar_channel: "LIDAR_CONCAT"

# Whether to read from rosbag (True) or from file-based data (False)
use_rosbag: False

# Topic mapping: T4 channel name -> ROS topic in rosbag
# Only needed when use_rosbag is True
# topic_mapping:
#   LIDAR_TOP: "/sensing/lidar/top/pointcloud_raw"

# Range image parameters
range_image_width: 1024
range_image_height: 128
inc_bottom: -5.0
inc_top: 38.0
max_depth: 120.0
