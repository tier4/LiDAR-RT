data_type: "T4"

# Single TOP LiDAR configuration (Waymo-style baseline).
# Multi-LiDAR setup is preserved in git history (revert this file to restore).
lidar_sensors:
  - name: hesai_top
    topic: "/sensing/lidar/top/pandar_packets"
    sensor_type: "OT128"
    frame_id: "hesai_top"
    range_image_height: 128
    range_image_width: 1800
    inc_bottom: -25.0
    inc_top: 15.0
    max_depth: 200.0

max_depth: 200.0
