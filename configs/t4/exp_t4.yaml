parent_config: configs/base.yaml

model_dir: "output"
task_name: t4_tuned
exp_name: test

testing_iterations: 1000
saving_iterations: [15000, 20000, 25000, 30000]
visual_interval: 1000

model:
  voxel_size: 0.15
  bkgd_extent_factor : 3
  object_extent_factor: 4
  obj_pt_num: 10_000
  dimension: 2
  sh_degree: 3

opt:
  iterations: 30_000
  position_lr_max_steps: 30_000

  densification_interval: 100
  opacity_reset_interval: 999999  # Effectively disabled. Was 6000, before
                                  # that 3000. Time-series analysis showed
                                  # each reset (α clamped to 0.01) caused a
                                  # 3-4M Gaussian prune wave in the next
                                  # cycle, then 3M+ rebuild via densify —
                                  # 30% retention overall. Disabling
                                  # eliminates the periodic upheaval; the
                                  # continuous opacity_prune (α<0.02) plus
                                  # sky_prune / front_prune / occupancy_loss
                                  # already provide enough downward pressure
                                  # to shed junk Gaussians.
  densify_from_iter: 1500          # Was 500. Lets the initial 1.2M
                                   # PCD-seeded Gaussians settle their α
                                   # before clone/split adds more candidates.
                                   # Cuts the iter 0-1000 churn observed
                                   # in the last run (~200K early prunes).
  densify_until_iter: 15_000
  densify_until_num_points: 500_000    # Was 2M, then 1M. Render-sweep analysis
                                       # showed only 22% of bg (470K of 2.13M)
                                       # accumulated any weight across all train
                                       # frames — 78% were dead. Combined with
                                       # the new dead_prune (kills 0-view-count
                                       # Gaussians inline), capping at 500K keeps
                                       # roughly all-alive bg with no quality
                                       # loss. Reduces GPU + BVH cost by ~4x.
                                       # bg reaches this, only prune fires
                                       # (skip_densify=True). Bounds final
                                       # population near a sustainable size.

  densify_use_absgrads: False
  densify_scale_threshold: 0.0002
  densify_grad_threshold: 0.002   # Was 0.001 (and 0.0005 before). Halved spawn
                                  # rate. Combined with 500K cap above and the
                                  # dead_prune, expected steady-state spawn/
                                  # prune cumulative drops 3-4x from the prior
                                  # run's 12M/10M, and final pop lands near
                                  # 300-500K bg — close to the 470K we measured
                                  # as actually active in the prior ckpt. With reset
                                  # disabled and a 1M cap, the model needs
                                  # to be more selective about WHICH high-
                                  # gradient pixels actually warrant a new
                                  # Gaussian. 2x raise from prior setting
                                  # halves spawn rate to ~400/iter (was
                                  # 825/iter), and combined with the cap
                                  # gives a sustainable 2-2.5M steady-state
                                  # population.
  densify_weight_threshold: 0.0
  prune_size_threshold: 0.1
  thresh_opa_prune: 0.02   # Was 0.001 — bg ckpt analysis showed ~55% of
                           # Gaussians sat at α < 0.05 (median 0.024) as
                           # barely-rendering fluff that escaped the old
                           # threshold. 0.02 lands at the bottom of the
                           # bimodal opacity gap (p50 of bg = 0.024) so
                           # fluff gets killed while moderate-α Gaussians
                           # (0.05-0.3) survive.
  min_scale: 1.0e-6   # Lower bound on σ=exp(_scaling) applied every Adam step;
                      # prevents OptiX EXCESSIVE_DEGENERATE_PRIMITIVES warnings
                      # caused by post-densify scale drift. 0 disables.

  lambda_normal: 0.00
  lambda_cd: 0.01
  lambda_depth_l1: 0.5
  lambda_intensity_l1: 0.85
  lambda_intensity_l2: 0.0
  lambda_intensity_dssim: 0.15
  lambda_raydrop_bce: 0.01
  lambda_reg: 0.1
  lambda_sky: 0.02
  lambda_freespace: 0.0   # Replaced by lambda_front_acc (covers sky rays via target_depth=∞ sentinel).
                          # Set to 0 to turn the old sky-only freespace loss off.
  lambda_front_acc: 0.05  # Penalise alpha accumulated strictly in front of GT hit (or ∞ for sky).
                          # Front-side accumulation loss: directly attacks horizon-ring phantoms
                          # on hit rays that the sky-only freespace loss cannot see.

  # Edge-boosted depth & front_acc loss: detect GT-depth discontinuities
  # (Sobel gradient on gt_depth, both-side-valid only) and multiply both
  # depth_loss and front_acc_loss by (1 + edge_loss_boost) at those pixels.
  # Discourages the model from settling into a local minimum that fills
  # the depth gap with a sheet of thin phantom Gaussians ("stacked
  # phantom" pattern at horizon ring and ground edges). Off when either
  # threshold or boost is 0.
  edge_depth_grad_thresh: 5.0   # m/pixel; below this the pixel isn't an edge
  edge_loss_boost: 0.5          # added on top of 1.0 → edge pixels get 1.5x.
                                # Higher values amplify the depth gradient at
                                # edges → drives extra densification there
                                # (observed 2.57M points by iter 3K with
                                # boost=2.0). 0.5 keeps the anti-phantom
                                # signal while throttling over-densify.

  # Stack loss (B): kernel-level soft contributor count per pixel +
  # edge-restricted L1 on (n_contributors - 1). Directly targets the
  # "many thin Gaussians lined up at an edge" failure mode. Off when
  # lambda_stack == 0 (the kernel skips the soft-counter atomic adds
  # entirely so unused config stays cheap).
  lambda_stack: 0.05
  contributor_alpha_threshold: 0.1   # sigmoid midpoint over alpha
  contributor_alpha_sharpness: 50.0  # higher → step-like
  lambda_occupancy: 0.05  # Penalise opacity of bg Gaussians sitting in voxels no LiDAR return ever hit
  occupancy_voxel_size: 0.1    # World-frame voxel size (m) for the occupancy grid
  occupancy_warmup_iter: 3000  # Gate the loss until densification has settled
  occupancy_free_max_depth: 100.0  # Max ray length (m) traced during free-voxel
                                   # discovery. Beyond this distance voxels stay
                                   # "unknown" (no observation evidence)

  # Occupancy hard prune (bg only). The soft loss_occupancy is a
  # per-Gaussian-mean push that hovers at equilibrium because none of the
  # other prune mechanisms (sky / front / opacity) catches out-of-LiDAR-FOV
  # high-opacity Gaussians in free voxels. This hard-prunes any bg
  # Gaussian whose world-frame centre lands in a free voxel AND whose
  # opacity exceeds threshold — definitionally a phantom (LiDAR never
  # returned there, yet it's rendering visibly). Reuses the same
  # OccupancyGrid the soft loss builds at startup.
  # Dead-Gaussian hard prune (bg only). Targets the structural failure
  # mode where densify spawns Gaussians at positions outside the LiDAR's
  # reachable cone — they never receive a ray hit, get no gradient, drift
  # α to 1.0 unchecked, and escape every other prune mechanism. A
  # render-sweep analysis showed 60% (Waymo) to 78% (T4) of bg in this
  # state. We track view_count (already used by sky_prune / front_prune)
  # across each ~100-iter densify cycle and prune any bg Gaussian with
  # view_count < min_views (= never observed). Runs FIRST in
  # densify_and_prune so fresh clone/split spawns (vc=0 by construction)
  # aren't mistakenly culled.
  dead_prune_enabled: true
  dead_prune_warmup_iter: 3000     # let densify settle before the first sweep
  dead_prune_min_views: 1          # 0 observations across the cycle → kill
  dead_prune_min_contrib: 0.001    # per-frame α·T threshold to count as "observed"

  occupancy_prune_enabled: false  # Disabled in favour of edge_loss_boost + lambda_stack
                                  # which target edge phantoms at the source (densification)
                                  # rather than removing them after the fact. Re-enable as
                                  # a safety net if the new edge-aware losses don't suffice.
  occupancy_prune_warmup_iter: 3000      # gate until densification settled
  occupancy_prune_opacity_threshold: 0.5  # opa > this & in free voxel → kill
  min_range_prune: 1.0   # Hard-prune background Gaussians within this distance from any sensor
  sky_morph_kernel: 5    # Morphological closing kernel applied to gt_mask before sky loss
                         #   (0/1 = disabled, 3 fills 1-pix holes, 5 fills 2-pix holes)

  # Sky-mask hard-prune: opt-in safety net for sky phantom Gaussians that the
  # depth/free-space losses fail to thin out. The rasterizer computes per-
  # Gaussian alpha*T weighted by the sky mask; a Gaussian is judged "sky in
  # this view" when (sky_contribution / total_contribution) exceeds
  # sky_prune_pixel_ratio_threshold AND its total_contribution exceeds
  # sky_prune_min_total_contrib. At densify time, a Gaussian is removed
  # outright when at least sky_prune_min_views observations passed AND the
  # fraction of those views judging it "sky" exceeds
  # sky_prune_view_consistency_threshold.
  sky_prune_enabled: true
  sky_prune_warmup_iter: 3000           # Gate the path until densification has settled
  sky_prune_pixel_ratio_threshold: 0.8  # per-view sky/total ratio to judge "sky"
  sky_prune_min_total_contrib: 0.001    # ignore Gaussians barely contributing this view
  sky_prune_view_consistency_threshold: 0.8  # fraction of observed views that must agree
  sky_prune_min_views: 3                # minimum #views before any prune decision
  # Final deterministic sweep after the main training loop ends: re-renders
  # every training frame once, accumulates per-Gaussian sky stats fresh, and
  # hard-prunes. Catches phantoms that escaped the in-training 100-iter window.
  # Saves a separate model_it_<iter>_skyprune.pth checkpoint.
  sky_prune_final_sweep: true

  # Anisotropy hard-prune (bg only). DISABLED — collateral damage was too high:
  # legitimate pillars (lamp posts, sign poles, narrow trunks) are themselves
  # line-like surfels (aniso 10-30 range) and the threshold can't distinguish
  # them from horizon-ring edge phantoms without help. The front-side
  # accumulation loss (lambda_front_acc, see above) is the principled
  # replacement: it sees phantoms specifically as alpha sitting *in front of*
  # a real LiDAR return, which pillars never do (they ARE the return). The
  # plumbing stays so the prune can be re-armed as a safety net with a much
  # higher threshold (e.g. max_aniso=50) once front_acc is tuned.
  aniso_prune_enabled: false
  aniso_prune_warmup_iter: 3000
  max_aniso_prune: 10.0
  aniso_prune_max_opacity: 0.5

  # Front-side multi-view hard-prune (bg only). Mirror of sky_prune but for
  # hit rays: a Gaussian whose contribution is consistently *in front of*
  # the GT target_depth across many views is a horizon-ring / near-range
  # phantom. The lambda_front_acc loss alone can't always defeat
  # opacity_reset cycles, so this provides a decisive multi-view safety
  # net. Uses the same accum_gaussian_front_weights per-Gaussian signal
  # the kernel records (forward.cu) for target_depth-supplied views.
  front_prune_enabled: true
  front_prune_warmup_iter: 3000
  front_prune_pixel_ratio_threshold: 0.8       # per-view front/total to judge "front"
  front_prune_min_total_contrib: 0.001          # ignore Gaussians barely contributing
  front_prune_view_consistency_threshold: 0.8  # fraction of views that must agree
  front_prune_min_views: 3                      # minimum #views before any decision

  use_rayhit: True

  use_normal_init: True
  use_voxel_init: True


refine:
  use_refine: True
  use_spatial: True
  use_rot: False

  epochs: 400
  batch_size: 16
  lr: 0.001
  lambda_raydrop_bce: 0.01
