parent_config: configs/base.yaml

model_dir: "output"
task_name: t4_tuned
exp_name: test

testing_iterations: 1000
saving_iterations: [15000, 20000, 25000, 30000]
visual_interval: 1000

model:
  voxel_size: 0.15
  bkgd_extent_factor : 3
  object_extent_factor: 4
  obj_pt_num: 10_000
  dimension: 2
  sh_degree: 3

opt:
  iterations: 30_000
  position_lr_max_steps: 30_000

  densification_interval: 100
  opacity_reset_interval: 999999  # Effectively disabled. Was 6000, before
                                  # that 3000. Time-series analysis showed
                                  # each reset (α clamped to 0.01) caused a
                                  # 3-4M Gaussian prune wave in the next
                                  # cycle, then 3M+ rebuild via densify —
                                  # 30% retention overall. Disabling
                                  # eliminates the periodic upheaval; the
                                  # continuous opacity_prune (α<0.02) plus
                                  # sky_prune / front_prune / occupancy_loss
                                  # already provide enough downward pressure
                                  # to shed junk Gaussians.
  densify_from_iter: 1500          # Was 500. Lets the initial 1.2M
                                   # PCD-seeded Gaussians settle their α
                                   # before clone/split adds more candidates.
                                   # Cuts the iter 0-1000 churn observed
                                   # in the last run (~200K early prunes).
  densify_until_iter: 15_000   # Sweep bt1rh0dm: ALL top-5 runs picked 15K
                               # (vs 10K, 12K, 15K options). Earlier "12K cuts
                               # churn waste" intuition was wrong on the actual
                               # phantom metric — spawn budget matters more
                               # than per-spawn survival rate.
  densify_until_num_points: 500_000    # Was 2M, then 1M. Render-sweep analysis
                                       # showed only 22% of bg (470K of 2.13M)
                                       # accumulated any weight across all train
                                       # frames — 78% were dead. Combined with
                                       # the new dead_prune (kills 0-view-count
                                       # Gaussians inline), capping at 500K keeps
                                       # roughly all-alive bg with no quality
                                       # loss. Reduces GPU + BVH cost by ~4x.
                                       # bg reaches this, only prune fires
                                       # (skip_densify=True). Bounds final
                                       # population near a sustainable size.

  densify_use_absgrads: False
  densify_scale_threshold: 0.0002
  densify_grad_threshold: 0.0016  # Sweep bt1rh0dm top-5 picks: 0.00154,
                                  # 0.00154, 0.00206, 0.00167, 0.00160 — all
                                  # near the sweep range's bottom (0.0015).
                                  # Reverses the prior "churn-cut" 0.003 which
                                  # was 4x worse than the 0.0015 quartile
                                  # (32K vs 23K phantom mean). Lower bar →
                                  # more spawn candidates → more chances to
                                  # find useful geometry. The 70% same-cycle
                                  # dead_prune rate at low grad_threshold is
                                  # acceptable cost — surviving 30% beats
                                  # 70% survivors from a stingier proposal
                                  # set, on the phantom-pixel metric.
  densify_weight_threshold: 0.0
  prune_size_threshold: 0.1
  thresh_opa_prune: 0.02   # Was 0.001 — bg ckpt analysis showed ~55% of
                           # Gaussians sat at α < 0.05 (median 0.024) as
                           # barely-rendering fluff that escaped the old
                           # threshold. 0.02 lands at the bottom of the
                           # bimodal opacity gap (p50 of bg = 0.024) so
                           # fluff gets killed while moderate-α Gaussians
                           # (0.05-0.3) survive.
  min_scale: 1.0e-6   # Lower bound on σ=exp(_scaling) applied every Adam step;
                      # prevents OptiX EXCESSIVE_DEGENERATE_PRIMITIVES warnings
                      # caused by post-densify scale drift. 0 disables.

  lambda_normal: 0.00
  lambda_cd: 0.01
  # Rebalanced 2026-06-08 (second pass) against wandb runs llbhzw64 /
  # 697c9hvs. The first rebalance (depth_l1 0.5→1.0, intensity halved)
  # cut intensity's share from 67% to 37% but edge geometry actually
  # degraded (stack_loss +26%, front_acc +12%, phantom_pixels +8%) —
  # the photometric DSSIM was carrying more structural signal than
  # intensity L1 alone. Second pass: add depth-side DSSIM (= the proper
  # structural signal for what we want) and cut intensity further so
  # the model unambiguously prioritises geometric fit.
  # Expected new composition (using 697c9hvs raw losses @ iter 4K):
  #   depth_l1 ~3.14 (~72%), depth_dssim ~0.16 (~4%), intensity_l1+dssim
  #   ~0.53 (~12%), stack ~0.34 (~8%), sky ~0.19 (~4%), front_acc ~0.04
  #   (~1%). Depth occupies ~76% of the gradient signal.
  lambda_depth_l1: 1.0
  # Direct structural-similarity loss on log-normalised depth (window=11x11).
  # Catches "stacked phantom" patterns (many thin Gaussians at slightly
  # different depths around an edge) that depth L1 cannot see.
  # Log-normalisation: depth → log1p(d)/log1p(max_depth) — compresses
  # far-range, amplifies near-range where LiDAR phantoms cluster.
  # 0 disables.
  lambda_depth_dssim: 2.0   # was 0.10 — at iter-8000 (1-SSIM)≈0.08 →
                            # contribution ≈ 0.16, comparable to stack_loss.
                            # Naturally grows in relative importance as
                            # depth_l1 converges (l1 → 0 faster than
                            # 1-SSIM), giving a graceful "rough fit then
                            # structural refinement" curriculum.
  # L1 on rendered hits at no-return pixels, target = max_depth.
  # depth_l1 only fires on gt_mask=True, so the "no-return side of an
  # edge" (= sky pixel adjacent to a building edge) has zero depth-side
  # gradient under vanilla losses. analyze_edge_sky_regions.py on iter
  # 25K showed this 3% area holds 96% of all sky-side phantom hits
  # (29.1% phantom rate vs 0.26% in open-sky regions, density ratio
  # 113.7x). lambda_sky also targets this region but minimises depth →
  # 0 which creates a near-range "safe zone" (sky_loss formulation
  # discussion in commit 9ec9fc8). Targeting max_depth pushes phantoms
  # in the right direction (away). Clamp prevents one far-off rogue
  # phantom from dominating the gradient.
  # Clamp range expanded 2026-06-09 after ablation (run sbegy5u6 vs
  # 6zzsvfxz, both 30K iter). Original λ=0.1, max_err=20m gave +1.6%
  # eval/depth_mae over the λ=0 baseline but `train/no_return_l1_loss`
  # stayed at 1.93 for the entire 30K iter run — i.e. the loss never
  # escaped clamp saturation (mean phantom rd_depth ~45-55m << target
  # 200m, raw err ~145m clamped to 20m). Two side-effects of the
  # saturation:
  #   1. Loss value is uninformative (≈ λ × max_err always)
  #   2. Gradient within the clamp range is constant → no "kill the
  #      far phantom first" preference (all sky-side hits get equal α
  #      pressure, sometimes pushing more weight toward viz_min_depth
  #      close-range phantoms — phantom_pixels +1.3% in MAIN vs ABL).
  # Fix: raise max_err to 100m so the typical phantom depth band
  # (30-100m) sits in the linear region. To keep total penalty
  # magnitude unchanged, lower λ by the same factor:
  #   OLD: λ=0.1, max_err=20  → λ × max_err = 2.0
  #   NEW: λ=0.02, max_err=100 → λ × max_err = 2.0
  # In the linear region the gradient becomes distance-weighted
  # (kills far phantoms preferentially) — same desirable property as
  # lambda_sky but without sky_loss's close-range "safe zone".
  lambda_no_return_l1: 0.02
  no_return_l1_max_err: 100.0
  lambda_intensity_l1: 0.1    # was 0.4 (originally 0.85). Geometry is the
                              # primary task, intensity is auxiliary.
  lambda_intensity_l2: 0.0
  lambda_intensity_dssim: 0.025  # was 0.075 — cut in line with L1 so
                                  # intensity in total occupies ~12% of
                                  # the gradient. Kept non-zero because
                                  # the UNet raydrop refinement (stage 2)
                                  # needs a sensible rendered intensity
                                  # signal at hand-off.
  lambda_raydrop_bce: 0.01
  lambda_reg: 0.1
  # Held at 0.02. Earlier (2026-06-08 evening) I hypothesised sky_loss
  # was structurally pathological — formulation is
  # `lambda * mean(rendered_depth at sky-hit pixels)`, which I argued
  # only pulls phantom depths toward 0 without reducing α. Empirical
  # check (run d0hasa77 → sky-disabled follow-up) showed the depth
  # image visibly degraded with lambda_sky=0, so the hypothesis was
  # wrong. The likely missing piece in my analysis: rendered depth is
  # α-weighted (Σαᵢ Tᵢ dᵢ / Σαᵢ Tᵢ), so reducing the weighted average
  # CAN be achieved by reducing α of far phantoms — even with the
  # apparent "depth-pulling" failure mode, the α reduction does
  # happen. front_acc by itself is not a full replacement.
  lambda_sky: 0.02
  lambda_freespace: 0.0   # Replaced by lambda_front_acc (covers sky rays via target_depth=∞ sentinel).
                          # Set to 0 to turn the old sky-only freespace loss off.
  lambda_front_acc: 0.10  # was 0.05 — same run showed front_acc only
                          # carried ~0.25% of total loss. Doubling brings
                          # it to ~0.5% and gives more bite to the no-return
                          # phantom band once edge_mask_dilate_px=1 sweeps
                          # those pixels into the 1.5x edge boost.
                          # Penalise alpha accumulated strictly in front of GT hit (or ∞ for sky).
                          # Front-side accumulation loss: directly attacks horizon-ring phantoms
                          # on hit rays that the sky-only freespace loss cannot see.

  # Edge-boosted depth & front_acc loss: detect GT-depth discontinuities
  # (Sobel gradient on gt_depth, both-side-valid only) and multiply both
  # depth_loss and front_acc_loss by (1 + edge_loss_boost) at those pixels.
  # Discourages the model from settling into a local minimum that fills
  # the depth gap with a sheet of thin phantom Gaussians ("stacked
  # phantom" pattern at horizon ring and ground edges). Off when either
  # threshold or boost is 0.
  edge_depth_grad_thresh: 15.0  # Sobel magnitude threshold (m/pixel) for the
                                # geometric-edge half of edge_mask. Was 5.0,
                                # which caught ~32% of valid pixels (every
                                # ground-plane slope qualified — Sobel kernel
                                # peak ≈ 4 × per-pixel depth jump, so thr=5
                                # catches steps as small as 1.25m/pixel).
                                # Empirical visualization (see
                                # visualize_edge_thresholds.py) shows 15
                                # cleans up ground noise while keeping
                                # building/tree object boundaries. Combined
                                # with the new sky-boundary union (any
                                # valid pixel adjacent to no-return),
                                # final edge_mask covers ~25% of valid
                                # pixels and specifically targets phantom
                                # collection regions.
  edge_loss_boost: 0.5          # added on top of 1.0 → edge pixels get 1.5x.
                                # Higher values amplify the depth gradient at
                                # edges → drives extra densification there
                                # (observed 2.57M points by iter 3K with
                                # boost=2.0). 0.5 keeps the anti-phantom
                                # signal while throttling over-densify.
  # Dilate the edge_mask (sobel_edge | sky_boundary) by N pixels via
  # max_pool2d before the edge_weight / stack_loss filter is applied.
  # Ghost analysis on ckpt_it_8000 (output/ghost_edge_8000/per_bin.csv)
  # found phantom hits cluster at dist=1 px from the undilated band —
  # 95% sit on the no-return side one pixel beyond it. Dilating sweeps
  # those pixels into:
  #   - front_acc edge-boost: weighted_acc = accum_at_target * edge_weight,
  #       and target_depth=1e6 on no-return pixels → snapshot covers the
  #       whole ray, so boost flows through to phantoms there.
  #   - stack_loss gating: excess[edge_mask].mean() — dilated no-return
  #       pixels with ≥2 contributors get penalised as stacked phantoms.
  # depth_l1 is still filtered by [gt_mask].mean() so its boost only
  # widens on the valid side (covers the dist=1 high-err band, ~21% of
  # all >1m errors); it cannot reach phantoms by design — front_acc /
  # stack are the channels that do.
  # 0 disables (back-compat with pre-2026-06-08 behaviour).
  edge_mask_dilate_px: 1

  # Stack loss (B): kernel-level soft contributor count per pixel +
  # edge-restricted L1 on (n_contributors - 1). Directly targets the
  # "many thin Gaussians lined up at an edge" failure mode. Off when
  # lambda_stack == 0 (the kernel skips the soft-counter atomic adds
  # entirely so unused config stays cheap).
  lambda_stack: 0.10                 # Sweep bt1rh0dm: 0.10 was best in 4/5
                                     # top-5 runs (vs 0.0, 0.05, 0.2 options);
                                     # 0.20 was worst (32K phantom mean vs 23K
                                     # for 0.10). Reaches diminishing returns
                                     # past 0.10.
  contributor_alpha_threshold: 0.1   # sigmoid midpoint over alpha
  contributor_alpha_sharpness: 50.0  # higher → step-like

  # Per-edge-ray allowed-depth loss (lib/scene/edge_ray_allowed.py) was
  # tried 2026-06-05..08 with mask_dilate_px=1 informed by ghost analysis
  # (output/ghost_edge_8000/per_bin.csv) — effect on phantom metric was
  # too small to justify the 5-15 min cache build and the per-step
  # overhead. Code path is dormant while `lambda_edge_ray_allowed` is
  # unset (train.py:219 gates the entire build on `lambda > 0`).
  # Re-enable by adding `lambda_edge_ray_allowed: 0.03` (and any other
  # edge_ray_* overrides) back to this file.

  lambda_occupancy: 0.05  # Penalise opacity of bg Gaussians sitting in voxels no LiDAR return ever hit
  occupancy_voxel_size: 0.1    # World-frame voxel size (m) for the occupancy grid
  occupancy_warmup_iter: 3000  # Gate the loss until densification has settled
  occupancy_free_max_depth: 100.0  # Max ray length (m) traced during free-voxel
                                   # discovery. Beyond this distance voxels stay
                                   # "unknown" (no observation evidence)

  # Occupancy hard prune (bg only). The soft loss_occupancy is a
  # per-Gaussian-mean push that hovers at equilibrium because none of the
  # other prune mechanisms (sky / front / opacity) catches out-of-LiDAR-FOV
  # high-opacity Gaussians in free voxels. This hard-prunes any bg
  # Gaussian whose world-frame centre lands in a free voxel AND whose
  # opacity exceeds threshold — definitionally a phantom (LiDAR never
  # returned there, yet it's rendering visibly). Reuses the same
  # OccupancyGrid the soft loss builds at startup.
  # Dead-Gaussian hard prune (bg only). Targets the structural failure
  # mode where densify spawns Gaussians at positions outside the LiDAR's
  # reachable cone — they never receive a ray hit, get no gradient, drift
  # α to 1.0 unchecked, and escape every other prune mechanism. A
  # render-sweep analysis showed 60% (Waymo) to 78% (T4) of bg in this
  # state. We track view_count (already used by sky_prune / front_prune)
  # across each ~100-iter densify cycle and prune any bg Gaussian with
  # view_count < min_views (= never observed). Runs FIRST in
  # densify_and_prune so fresh clone/split spawns (vc=0 by construction)
  # aren't mistakenly culled.
  dead_prune_enabled: true
  # Staggered warmups (2026-06-08, post-sds9rkol audit). The run showed
  # bg population dropped 858K → 461K in ONE densify cycle (iter 3000
  # → 3100) when dead+front+sky prunes all woke up simultaneously at
  # warmup_iter=3000 — a 46% wipeout that took 12K iter to recover
  # from. Spacing the warmups by 2K (= 20 densify cycles) per stage
  # spreads the wave into three smaller drops instead of one cliff.
  # Order: dead first (kills unambiguously inert mass), then front
  # (needs front_acc accum data, which warms up by iter ~5K), then
  # sky (slowest to converge — view-consistency requires multiple
  # observations).
  dead_prune_warmup_iter: 3000     # baseline; densify_until_iter=15K leaves
                                    # 12K cycles for the dead-only sweep to
                                    # work before front/sky come in
  dead_prune_min_views: 1          # OK as is: 1 densify cycle ≈ 100 iter ≈
                                    # 2.3 epoch over 43 train frames → a
                                    # Gaussian needs to be invisible across
                                    # ~100 frame samples to be killed
  dead_prune_min_contrib: 0.001    # per-frame α·T threshold to count as "observed"

  # Ego-swept-volume hard prune (bg only, OBB). The ego vehicle physically
  # occupied each pose's volume at that frame's moment → no static-scene
  # geometry can exist there. Bg Gaussians whose centres land inside any
  # configured ego-frame bbox at any cached pose (base + interp) are pruned.
  # Ego poses are densified with 5 interpolations per consecutive-frame
  # segment so the OBB swept volume has no gaps for thin parts (mirrors
  # are X 0.32 m thick; ego moves ~2 m / frame → 0.4 m step << thinnest dim).
  #
  # Bbox entries are [min_x, min_y, min_z, max_x, max_y, max_z] in EGO frame
  # (X forward, Y left, Z up — Autoware / Tier4 vehicle convention).
  # Default values from the JpnTaxi description in pilot-auto.xx1
  # (src/description/vehicle/jpntaxi_description/.../config/):
  #   vehicle_info.param.yaml:
  #     wheel_base=2.75, wheel_tread=1.485, front_overhang=0.8,
  #     rear_overhang=0.85, left/right_overhang=0.105, vehicle_height=2.5
  #   →  min_x = -rear_overhang                       = -0.85
  #      max_x = front_overhang + wheel_base          =  3.55
  #      min_y = -(wheel_tread/2 + right_overhang)    = -0.8475
  #      max_y =  (wheel_tread/2 + left_overhang)     =  0.8475
  #      min_z = 0, max_z = vehicle_height            =  2.5
  #   mirror.param.yaml: min/max longitudinal/lateral/height offsets used verbatim.
  # Disabled 2026-06-08: empirically worsened eval metrics — likely
  # killing legitimate near-body returns (low overhanging branches /
  # tunnel ceilings / mirror reflections of nearby Gaussians) along with
  # the intended interior phantoms. The swept-volume assumption was too
  # strict for this scene. Bbox defaults below stay so we can re-enable
  # quickly by flipping this flag.
  ego_prune_enabled: false
  ego_prune_warmup_iter: 1500           # same as densify_from_iter — only
                                        # prunes after PCD seeds had a chance
                                        # to migrate out of the swept volume
  ego_bboxes:
    # main body
    - [-0.85,   -0.8475, 0.0,    3.55, 0.8475, 2.5 ]
    # side mirrors (from mirror.param.yaml)
    - [ 2.84,   -1.03,   0.86,   3.16, 1.03,   1.22]

  # Oversized force-split (bg only). The standard densify_and_split path
  # requires (grad >= densify_grad_threshold) AND (max_scale > scale_thr) —
  # a Gaussian that's too big but has converged grad never gets split, so
  # it sits there smearing across surfaces. This force-splits any Gaussian
  # whose max σ exceeds `oversized_split_max_scale` IGNORING gradient.
  # Each candidate becomes 2 children at perturbed positions with
  # σ ← σ / (0.8 * 2) = σ / 1.6 each. Net +1 per split.
  #
  # Layered design with lambda_scale_reg:
  #   σ ≤ scale_reg_max  (1.0 m): no penalty
  #   σ ∈ (1.0, 1.5] m:           soft scale_reg pushes σ down
  #   σ > oversized_split_max_scale (1.5 m): hard split
  oversized_split_enabled: true
  oversized_split_max_scale: 1.5      # m, slightly above scale_reg_max
  oversized_split_warmup_iter: 1500   # same gate as densify_from_iter

  # Bg scale-range regulariser. Two-sided hinge loss on σ (per-axis):
  # penalty = mean( clamp(min - σ, 0) ) + mean( clamp(σ - max, 0) ).
  # Pulls σ into [min, max] without penalising values inside the band.
  # Bg is otherwise un-regularised — the box_reg_loss scale term only
  # fires for object Gaussians (with bounding_box).
  #
  # Tightened 2026-06-08 (after iter-25K bg distribution audit):
  # analyze_gaussian_stats.py on model_it_25000.pth showed 27.7% of bg
  # Gaussians had σ_max < 1cm (below the OLD scale_reg_min=0.01) and
  # 66.6% had σ_max < 3cm — i.e. roughly two thirds were geometrically
  # below the PCD voxel size (15cm) yet kept α=1.0 and so survived all
  # prune mechanisms. A 5mm surfel at 30m subtends 1e-4 rad while a
  # Hesai-OT128 beam covers ~1.7e-3 rad, so these tiny stubs can't
  # cover even one full beam footprint — they're capacity waste that
  # also worsens edge-pixel averaging (more contributors per ray =
  # higher stack_loss). The old (0.02, 0.01) settings were too lax:
  # at λ=0.02 a 5mm Gaussian's hinge penalty was ~0.0001, weaker than
  # the depth gradient pull that produced it. 5x stronger λ + 3x
  # higher floor forces the bottom 27% of the population to either
  # grow into the useful band or get eliminated by other prunes.
  lambda_scale_reg: 0.10   # was 0.02
  scale_reg_min: 0.03      # was 0.01 — match PCD voxel order (15cm/5)
                           # and set above the Hesai beam footprint at
                           # close range (~3cm at 2m). Hard per-step
                           # clamp at min_scale=1e-6 stays as a safety
                           # net for numerical degeneracy.
  scale_reg_max: 1.0       # m, soft ceiling (unchanged)

  occupancy_prune_enabled: false  # Disabled in favour of edge_loss_boost + lambda_stack
                                  # which target edge phantoms at the source (densification)
                                  # rather than removing them after the fact. Re-enable as
                                  # a safety net if the new edge-aware losses don't suffice.
  occupancy_prune_warmup_iter: 3000      # gate until densification settled
  occupancy_prune_opacity_threshold: 0.5  # opa > this & in free voxel → kill
  min_range_prune: 1.0   # Hard-prune background Gaussians within this distance from any sensor
  sky_morph_kernel: 5    # Morphological closing kernel applied to gt_mask before sky loss
                         #   (0/1 = disabled, 3 fills 1-pix holes, 5 fills 2-pix holes)

  # Sky-mask hard-prune: opt-in safety net for sky phantom Gaussians that the
  # depth/free-space losses fail to thin out. The rasterizer computes per-
  # Gaussian alpha*T weighted by the sky mask; a Gaussian is judged "sky in
  # this view" when (sky_contribution / total_contribution) exceeds
  # sky_prune_pixel_ratio_threshold AND its total_contribution exceeds
  # sky_prune_min_total_contrib. At densify time, a Gaussian is removed
  # outright when at least sky_prune_min_views observations passed AND the
  # fraction of those views judging it "sky" exceeds
  # sky_prune_view_consistency_threshold.
  sky_prune_enabled: true
  sky_prune_warmup_iter: 7000           # Was 3000 — staggered to land after
                                         # dead_prune (3K) and front_prune (5K)
                                         # have stabilised the population.
                                         # See dead_prune comment for context.
  sky_prune_pixel_ratio_threshold: 0.8  # per-view sky/total ratio to judge "sky"
  sky_prune_min_total_contrib: 0.001    # ignore Gaussians barely contributing this view
  sky_prune_view_consistency_threshold: 0.8  # fraction of observed views that must agree
  sky_prune_min_views: 3                # minimum #views before any prune decision
  # Final deterministic sweep after the main training loop ends: re-renders
  # every training frame once, accumulates per-Gaussian sky stats fresh, and
  # hard-prunes. Catches phantoms that escaped the in-training 100-iter window.
  # Saves a separate model_it_<iter>_skyprune.pth checkpoint.
  sky_prune_final_sweep: true

  # Anisotropy hard-prune (bg only). DISABLED — collateral damage was too high:
  # legitimate pillars (lamp posts, sign poles, narrow trunks) are themselves
  # line-like surfels (aniso 10-30 range) and the threshold can't distinguish
  # them from horizon-ring edge phantoms without help. The front-side
  # accumulation loss (lambda_front_acc, see above) is the principled
  # replacement: it sees phantoms specifically as alpha sitting *in front of*
  # a real LiDAR return, which pillars never do (they ARE the return). The
  # plumbing stays so the prune can be re-armed as a safety net with a much
  # higher threshold (e.g. max_aniso=50) once front_acc is tuned.
  aniso_prune_enabled: false
  aniso_prune_warmup_iter: 3000
  max_aniso_prune: 10.0
  aniso_prune_max_opacity: 0.5

  # Front-side multi-view hard-prune (bg only). Mirror of sky_prune but for
  # hit rays: a Gaussian whose contribution is consistently *in front of*
  # the GT target_depth across many views is a horizon-ring / near-range
  # phantom. The lambda_front_acc loss alone can't always defeat
  # opacity_reset cycles, so this provides a decisive multi-view safety
  # net. Uses the same accum_gaussian_front_weights per-Gaussian signal
  # the kernel records (forward.cu) for target_depth-supplied views.
  front_prune_enabled: true
  front_prune_warmup_iter: 5000     # Was 3000 — staggered to land 2K after
                                     # dead_prune. front_acc accumulator
                                     # signal is meaningful by iter ~4-5K so
                                     # this is also the natural lower bound.
  front_prune_pixel_ratio_threshold: 0.8       # per-view front/total to judge "front"
  front_prune_min_total_contrib: 0.001          # ignore Gaussians barely contributing
  front_prune_view_consistency_threshold: 0.8  # fraction of views that must agree
  front_prune_min_views: 3                      # minimum #views before any decision

  use_rayhit: True

  use_normal_init: True
  use_voxel_init: True


refine:
  use_refine: True
  use_spatial: True
  use_rot: False

  epochs: 400
  batch_size: 16
  lr: 0.001
  lambda_raydrop_bce: 0.01
