# Wandb sweep config for 20K-iteration hyperparameter search on the default
# T4 dataset. Refocused on DENSIFICATION dynamics — analysis of recent runs
# showed the population is essentially fully replaced during training
# (13M spawns / 1.4M-4M final pop, 30% retention) with two big reset waves
# wasting compute. The anti-phantom losses (lambda_occupancy /
# lambda_front_acc / lambda_sky / lambda_stack) have been tuned and stay
# at their configs/t4/exp_t4.yaml values for this sweep.
#
# Usage (from repo root):
#   ./run_sweep_t4.sh --create
#   ./run_sweep_t4.sh <SWEEP_ID>
#
# Each run is 20K iter with --disable_refine (refinement adds ~30 min
# without affecting eval/total_phantom_pixels).

program: train.py
method: bayes
metric:
  # Same metric as before: phantom-pixel aggregate over every train + eval
  # frame on every sensor. Minimising this measures the densification
  # quality (good geometry → few near-range phantoms), not just the
  # phantom losses themselves.
  name: eval/total_phantom_pixels
  goal: minimize

# Bayes is sample-efficient at 5D; 30 runs gives a reasonable trend.
run_cap: 30

command:
  - ${env}
  - python
  - ${program}
  - -ec
  - configs/t4/exp_t4.yaml
  - -dc
  - configs/t4/dynamic/example.yaml
  - -s
  - /home/masaya/.webauto/data/data/annotation_dataset/433a2328-a5a6-4790-87d3-59e930ac7020/2
  - --iterations=20000
  - --disable_refine
  - ${args}

parameters:
  # Densification spawn rate. The dominant knob — controls how many
  # candidate Gaussians get clone/split each cycle. Current default 0.001
  # halved spawn vs the old 0.0005; we want to find the value where
  # eval/total_phantom_pixels is minimised without over-/under-fitting.
  densify_grad_threshold:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.005

  # Opacity reset waves. The biggest source of population churn — each
  # reset clamps α≤0.01 and the next densify cycle prunes 1.5-3M
  # Gaussians. 999999 = effectively disabled (the current default).
  # The sweep can re-discover whether some reset is actually useful.
  opacity_reset_interval:
    values: [3000, 6000, 999999]

  # Per-asset population cap. After this many points, densify enters
  # skip_densify=True (clone/split off, prune still on) for that asset.
  # Lower → smaller stable model; higher → richer geometry but more cost.
  densify_until_num_points:
    values: [500000, 1000000, 1500000, 2000000]

  # Opacity-based prune threshold. α below this gets pruned at every
  # densify cycle. Aggressive (0.05) sheds borderline Gaussians fast;
  # conservative (0.005) lets them recover.
  thresh_opa_prune:
    values: [0.005, 0.01, 0.02, 0.05]

  # Iter at which densify_and_prune starts firing. Higher = more time
  # for the initial PCD-seeded Gaussians to settle their α before
  # clone/split adds more candidates (cuts the ~200K early-phase prunes
  # observed in the iter 0-1000 window).
  densify_from_iter:
    values: [500, 1500, 3000]

# Hyperband over eval/total_phantom_pixels — kills runs whose phantom
# count stays high after the first couple of eval points (12K, 13K, ...).
early_terminate:
  type: hyperband
  min_iter: 14000     # let two eval points settle before culling
  eta: 2
